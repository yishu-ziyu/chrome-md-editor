[package]
name = "chrome-md-editor-desktop"
version = "1.4.15"
description = "Markdown Editor desktop shell (Tauri)"
authors = ["zhangweildlh"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chrome_md_editor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

name: Desktop Build (Tauri EXE)

permissions:
  contents: write

# 远端编译：不依赖本地安装任何程序。
# 推送分支 / 打 v* 标签 / 开 PR / 手动触发 → 在 GitHub windows-latest 云端
# 用 Rust + Tauri 把同一套 Web 源码（src/）打包成「绿色免安装」Windows EXE
# （单文件，双击即用，无需安装；依赖系统 WebView2 运行时）。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build portable Windows EXE (remote)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./desktop -> target"

      - name: Install web deps (root)
        run: npm ci

      - name: Generate Windows icon
        run: node desktop/scripts/make-ico.mjs

      - name: Build desktop (Tauri, portable — no installer)
        working-directory: desktop
        run: |
          npm install
          npm run tauri build

      - name: Locate & prepare portable EXE
        id: prep
        shell: bash
        run: |
          EXE=$(ls desktop/target/release/*.exe | head -1)
          VERSION=$(node -p "require('./package.json').version")
          OUT="desktop/target/release/Markdown.Editor_${VERSION}_portable.exe"
          cp "$EXE" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "Prepared portable EXE: $OUT"

      - name: Upload artifact (portable EXE)
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor-portable
          path: ${{ steps.prep.outputs.out }}

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prep.outputs.out }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
